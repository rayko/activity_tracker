default: &default
  adapter: postgresql
  max_connections: <%= ENV.fetch("DB_POOL") { 5 } %>
  timeout: 5000
  connect_timeout: 15
  encoding: unicode
  username: <%= ENV.fetch("DB_USER") { "" } %>
  password: <%= ENV.fetch("DB_PASS") { "" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DB_PORT") { "5432" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "activity_tracker_development" } %>

test:
  <<: *default
  database: test_db

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME") { "activity_tracker_db" } %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_CACHE") { "activity_tracker_cache" } %>
    migrations_paths: db/cache_migrate
